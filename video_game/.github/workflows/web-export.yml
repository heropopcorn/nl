name: web-export

on:
  pull_request:
  push:
    branches: [main]

jobs:
  export-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor + templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot-web-export
            ~/.local/share/godot/export_templates
          key: godot-4.7.2-web-${{ runner.os }}

      - name: Export HTML5 (single-threaded)
        run: bash tools/export-web.sh

      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: village-web
          path: export/web
          if-no-files-found: error
